name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so every step reads the same.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build the binary
        run: |
          # On Windows bun adds .exe, which Git Bash finds by itself.
          bun build src/cli/cq.ts --compile --outfile dist/cq
          dist/cq version
      - name: Build the launcher (macOS)
        if: runner.os == 'macOS'
        run: clang -O2 -Wall -Werror -o dist/cq-launcher bin/cq-launcher.c
      - name: Check the install script
        run: sh -n install.sh
      - name: Check the Windows install script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }
