name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build the binary
        run: |
          bun build src/cli/cq.ts --compile --outfile dist/cq
          dist/cq version
      - name: Build the launcher (macOS)
        if: runner.os == 'macOS'
        run: clang -O2 -Wall -Werror -o dist/cq-launcher bin/cq-launcher.c
      - name: Check the install script
        run: sh -n install.sh
