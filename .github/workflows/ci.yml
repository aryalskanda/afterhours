name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Build the binary
        run: |
          bun build src/cli/cq.ts --compile --outfile dist/cq
          dist/cq version
      - name: Build the launcher (macOS)
        if: runner.os == 'macOS'
        run: clang -O2 -Wall -Werror -o dist/cq-launcher bin/cq-launcher.c
      - name: Check the install script
        run: sh -n install.sh

  app:
    # The Expo app: types, the web build, and the web build end to end in headless Chrome against
    # a scripted machine through a real relay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: apps/app
      - run: npm run typecheck
        working-directory: apps/app
      - run: npm run export:web
        working-directory: apps/app
      - run: bun e2e/web.e2e.ts
        working-directory: apps/app
        env:
          CHROME: /usr/bin/google-chrome

  desktop:
    # The desktop app: types, its rules, the build, and the app end to end in test mode under a
    # virtual screen, against scripted machines through a real relay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: apps/app
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: bun test test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - name: The app end to end
        working-directory: apps/desktop
        # Ubuntu's AppArmor keeps Chromium's sandbox from starting on the runner.
        run: |
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 1
          DISPLAY=:99 ELECTRON_EXTRA_ARGS=--no-sandbox bun e2e/desktop.e2e.ts
      - name: Package (no installer)
        run: npx electron-builder --linux dir --publish never
        working-directory: apps/desktop
