# Runs scripts/compat.ts against the newest Claude Code: nightly, on demand, and before every
# release. Needs an ANTHROPIC_API_KEY repository secret (a Console API key; each run costs a
# few cents). Claude Code signs in with it through apiKeyHelper, so the key never passes
# through Afterhours.
name: Claude Code compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  compat:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: brew install tmux
      - name: Install the latest Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sign Claude Code in with the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Add an ANTHROPIC_API_KEY repository secret."; exit 1; }
          mkdir -p ~/.claude
          (umask 077 && printf '%s' "$ANTHROPIC_API_KEY" > ~/.claude/compat-key)
          echo '{"apiKeyHelper": "cat \"$HOME/.claude/compat-key\""}' > ~/.claude/settings.json
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json
          ~/.local/bin/claude --version
      - run: bun scripts/compat.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Keep the daemon log and session settings from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-failure
          path: |
            ${{ runner.temp }}/afterhours-compat-*/daemon.*
            ${{ runner.temp }}/afterhours-compat-*/home/jobs/
          retention-days: 7
