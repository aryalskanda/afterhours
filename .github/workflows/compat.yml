# Runs scripts/compat.ts against the newest Claude Code, nightly and on demand, when the
# repository has an ANTHROPIC_API_KEY secret (a Console API key; each run costs a few cents).
# Without one, the run is skipped rather than failed. Claude Code signs in with the key through
# apiKeyHelper, so it never passes through Afterhours.
name: Claude Code compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets can't be read in a job's `if`, so this looks for the key and tells the next job.
  key:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No ANTHROPIC_API_KEY secret, so the compatibility check is skipped. Run bun run compat locally before a release."
          fi

  compat:
    needs: key
    if: needs.key.outputs.present == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: brew install tmux
      - name: Install the latest Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Sign Claude Code in with the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p ~/.claude
          (umask 077 && printf '%s' "$ANTHROPIC_API_KEY" > ~/.claude/compat-key)
          echo '{"apiKeyHelper": "cat \"$HOME/.claude/compat-key\""}' > ~/.claude/settings.json
          echo '{"hasCompletedOnboarding": true}' > ~/.claude.json
          ~/.local/bin/claude --version
      - run: bun scripts/compat.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Keep the daemon log and session settings from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compat-failure
          path: |
            ${{ runner.temp }}/afterhours-compat-*/daemon.*
            ${{ runner.temp }}/afterhours-compat-*/home/jobs/
          retention-days: 7
