name: Desktop builds

# Unsigned installers for Mac, Windows and Linux, when a desktop-v* tag is pushed (or by hand).
# They're attached to the workflow run; publishing a release (and auto-update) waits for signing.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
        working-directory: apps/app
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: afterhours-desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
