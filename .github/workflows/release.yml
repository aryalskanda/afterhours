# Push a tag that matches package.json (git tag v0.1.0 && git push origin v0.1.0) to publish a
# release: after the type check and the tests, binaries for macOS (Apple Silicon, Intel), Linux
# (arm64, x64) and Windows (x64) are built, attested, and attached to a GitHub release with their checksums,
# the install scripts (install.sh, install.ps1) and the Homebrew formula. With a HOMEBREW_TAP_TOKEN secret (write access to
# <owner>/homebrew-tap), the tap is updated too. Run `bun run compat` before you tag: it needs a
# Claude sign-in, so it isn't part of this workflow.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # For build attestations: anyone can check a binary came from this workflow (gh attestation verify).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)."; exit 1; }
      - name: Build for macOS, Linux and Windows
        run: |
          mkdir -p dist
          for arch in arm64 x64; do
            bun build src/cli/cq.ts --compile --target="bun-darwin-$arch" --outfile "dist/cq-darwin-$arch"
            codesign --force --sign - "dist/cq-darwin-$arch"
            bun build src/cli/cq.ts --compile --target="bun-linux-$arch" --outfile "dist/cq-linux-$arch"
          done
          # One Windows build: Windows on Arm runs x64 programs as they are.
          bun build src/cli/cq.ts --compile --target=bun-windows-x64 --outfile dist/cq-windows-x64.exe
          dist/cq-darwin-arm64 version
          (cd dist && shasum -a 256 cq-darwin-arm64 cq-darwin-x64 cq-linux-arm64 cq-linux-x64 cq-windows-x64.exe > SHA256SUMS && cat SHA256SUMS)
          sed -e "s|{{repo}}|$GITHUB_REPOSITORY|g" install.sh > dist/install.sh
          if grep -n '{{' dist/install.sh; then echo "The install script still has placeholders."; exit 1; fi
          sed -e "s|{{repo}}|$GITHUB_REPOSITORY|g" install.ps1 > dist/install.ps1
          if grep -n '{{' dist/install.ps1; then echo "The Windows install script still has placeholders."; exit 1; fi
          sh -n dist/install.sh
      - name: Attest the binaries
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/cq-*'
      - name: Fill in the Homebrew formula
        run: |
          sum() { awk -v f="$1" '$2 == f {print $1}' dist/SHA256SUMS; }
          sed -e "s|{{repo}}|$GITHUB_REPOSITORY|g" -e "s|{{version}}|${GITHUB_REF_NAME#v}|g" \
              -e "s|{{sha256_darwin_arm64}}|$(sum cq-darwin-arm64)|g" -e "s|{{sha256_darwin_x64}}|$(sum cq-darwin-x64)|g" \
              -e "s|{{sha256_linux_arm64}}|$(sum cq-linux-arm64)|g" -e "s|{{sha256_linux_x64}}|$(sum cq-linux-x64)|g" \
              packaging/homebrew/afterhours.rb > dist/afterhours.rb
          if grep -n '{{' dist/afterhours.rb; then echo "The formula still has placeholders."; exit 1; fi
          { echo '### Homebrew formula'; echo '```ruby'; cat dist/afterhours.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cq-darwin-arm64 dist/cq-darwin-x64 dist/cq-linux-arm64 dist/cq-linux-x64 dist/cq-windows-x64.exe \
            dist/SHA256SUMS dist/install.sh dist/install.ps1 dist/afterhours.rb \
            --title "Afterhours $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/afterhours.rb tap/Formula/afterhours.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/afterhours.rb
          git commit -m "afterhours ${GITHUB_REF_NAME#v}"
          git push
