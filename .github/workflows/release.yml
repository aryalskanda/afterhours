# Push a tag that matches package.json (git tag v0.1.0 && git push origin v0.1.0) to publish a
# release: the compatibility check runs first, then the Apple Silicon and Intel binaries are built
# and attached to a GitHub release with the Homebrew formula for them. With a HOMEBREW_TAP_TOKEN
# secret (write access to <owner>/homebrew-tap), the tap is updated too.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  compat:
    uses: ./.github/workflows/compat.yml
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  release:
    needs: compat
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Check the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)."; exit 1; }
      - name: Build for Apple Silicon and Intel
        run: |
          mkdir -p dist
          for arch in arm64 x64; do
            bun build src/cli/cq.ts --compile --target="bun-darwin-$arch" --outfile "dist/cq-darwin-$arch"
            codesign --force --sign - "dist/cq-darwin-$arch"
          done
          dist/cq-darwin-arm64 version
          (cd dist && shasum -a 256 cq-darwin-arm64 cq-darwin-x64 > SHA256SUMS && cat SHA256SUMS)
      - name: Fill in the Homebrew formula
        run: |
          arm64="$(awk '$2 == "cq-darwin-arm64" {print $1}' dist/SHA256SUMS)"
          x64="$(awk '$2 == "cq-darwin-x64" {print $1}' dist/SHA256SUMS)"
          sed -e "s|{{repo}}|$GITHUB_REPOSITORY|g" -e "s|{{version}}|${GITHUB_REF_NAME#v}|g" \
              -e "s|{{sha256_arm64}}|$arm64|g" -e "s|{{sha256_x64}}|$x64|g" \
              packaging/homebrew/afterhours.rb > dist/afterhours.rb
          if grep -n '{{' dist/afterhours.rb; then echo "The formula still has placeholders."; exit 1; fi
          { echo '### Homebrew formula'; echo '```ruby'; cat dist/afterhours.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/cq-darwin-arm64 dist/cq-darwin-x64 dist/SHA256SUMS dist/afterhours.rb \
            --title "Afterhours $GITHUB_REF_NAME" --generate-notes --verify-tag
      - name: Update the Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/$GITHUB_REPOSITORY_OWNER/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/afterhours.rb tap/Formula/afterhours.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/afterhours.rb
          git commit -m "afterhours ${GITHUB_REF_NAME#v}"
          git push
