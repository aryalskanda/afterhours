# Installers for Mac, Windows and Linux. Unsigned for now: signing (and auto-update, which needs it
# on the Mac) waits for an Apple Developer ID and a Windows certificate.
appId: dev.afterhours.app
productName: Afterhours
copyright: Copyright © 2026 Afterhours
directories:
  output: release
  buildResources: build
# The app has no runtime dependencies: the web build and the main process are bundled. The last
# line keeps out the repository's Bun workspace packages, which electron-builder would copy in. It
# names the top-level folder only: the web build has assets under web/assets/node_modules/.
files:
  - dist/**
  - web/**
  - assets/**
  - package.json
  - "!node_modules/**"
asar: true
protocols:
  - name: Afterhours
    schemes: [afterhours]
# Electron's fuses: no running as plain Node, no NODE_OPTIONS or --inspect, and only the app's own
# (integrity-checked) archive loads.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.developer-tools
  # Ad-hoc signed: Apple Silicon runs nothing unsigned. Without a Developer ID, hardened runtime
  # would refuse Electron's own frameworks.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
dmg:
  title: Afterhours
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Afterhours
linux:
  category: Development
  executableName: afterhours
  # The window's WM_CLASS matches the launcher's .desktop file, so docks group them.
  syncDesktopName: true
  synopsis: Your machines' Claude Code queues
  target:
    - target: AppImage
      arch: [x64, arm64]
